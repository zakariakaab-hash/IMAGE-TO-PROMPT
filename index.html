    <script>
      // Compatibility shim for iframe/sandbox environments where window.fetch only has a getter
      (function() {
        try {
          const globalObj = typeof window !== 'undefined' ? window : typeof globalThis !== 'undefined' ? globalThis : self;
          let currentFetch = globalObj.fetch ? globalObj.fetch.bind(globalObj) : null;
          Object.defineProperty(globalObj, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {
          // Ignore if already configurable or restricted
        }
      })();
    </script>
